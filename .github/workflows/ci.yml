name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "web / test" and "api / test". Keep job ids stable.
  web:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: littlehelp
      # "lint" runs locally but has 14 errors to fix first (see issues).
      scripts: "typecheck build"

  api:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      working-directory: littlehelp/phase3
      python-version: "3.12"
