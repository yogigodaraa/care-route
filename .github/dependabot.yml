# Grouped so each ecosystem opens at most two PRs a week:
#   minor-and-patch -> auto-merged once CI passes
#   major           -> one PR to review by hand
version: 2
updates:
  - package-ecosystem: npm
    directory: /littlehelp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: pip
    directory: /littlehelp/phase3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
